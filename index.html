<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oráculo poético</title>
<style>
:root { color-scheme: dark; --bg: #050505; --panel: #050505; --ink: #f5f5f5; --muted: #b5b5b5; --line: #777777; --accent: #f5f5f5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
#app { min-height: 100vh; width: 100%; border-radius: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 28px 18px; position: relative; overflow: hidden; }
main { width: min(100%, 720px); text-align: center; position: relative; z-index: 1; padding-bottom: 110px; }
.moon { position: absolute; width: min(86vw, 680px); aspect-ratio: 1; left: max(-260px, -19vw); bottom: -39%; border-radius: 50%; background: radial-gradient(ellipse at 57% 52%, transparent 0 3%, #111 3.3% 4.1%, transparent 4.5%), radial-gradient(ellipse at 34% 39%, #555 0 2%, #a0a0a0 2.3% 3.8%, #555 4.2% 5.5%, transparent 5.8%), radial-gradient(ellipse at 58% 25%, #333 0 4%, #858585 4.4% 5.5%, transparent 6%), radial-gradient(ellipse at 70% 63%, #222 0 5%, #777 5.5% 6.3%, transparent 6.8%), radial-gradient(ellipse at 28% 66%, #333 0 3%, #888 3.5% 4.5%, transparent 5%), radial-gradient(ellipse at 48% 46%, #c8c8c8 0%, #9a9a9a 17%, #6d6d6d 38%, #393939 59%, #171717 72%, #050505 74%); box-shadow: inset -48px -20px 75px #000, inset 12px 12px 28px #eee9; opacity: .92; filter: contrast(1.12); }
.kicker { font: 11px/1.5 system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(42px, 9vw, 76px); font-weight: 400; letter-spacing: .18em; margin: 14px 0 8px; }
.subtitle { color: var(--muted); font-size: 16px; font-style: italic; margin: 0 0 34px; }
.card { background: transparent; border: 0; padding: clamp(28px, 7vw, 56px) 22px; min-height: 170px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: none; }
.verse { font-size: clamp(23px, 5vw, 36px); line-height: 1.45; max-width: 570px; }
.note { font: 11px system-ui, sans-serif; color: var(--muted); letter-spacing: .08em; margin-top: 22px; }
button { margin: 26px 0 0; border: 1px solid var(--accent); background: var(--accent); color: #050505; padding: 15px 25px; font: 600 11px system-ui, sans-serif; letter-spacing: .22em; cursor: pointer; transition: transform .15s, opacity .15s; }
button:hover { transform: translateY(-2px); } button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.actions button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
footer { margin-top: 42px; color: var(--muted); font: 11px system-ui, sans-serif; letter-spacing: .1em; }
</style>
</head>
<body><div id="app"><div class="moon" aria-hidden="true"></div><main>
<div class="kicker">EXEQUIEL SAPULA · Universo poético</div>
<h1>ORÁCULO</h1>
<p class="subtitle">Una máquina de asociaciones para entrar en el poema</p>
<section class="card" aria-live="polite"><div class="verse" id="verse">El sauce viejo recuerda luz en el centro del vacío</div><div class="note">GLOBO MEDULAR · CANTERA · DÁRSENA</div></section>
<div class="actions"><button id="generate">GENERAR VERSO</button><button class="secondary" id="copy">COPIAR VERSO</button></div>
<footer>Una palabra abre una puerta. El poema decide si entrar.</footer>
</main></div>
<script>
const subjects = ["lluvia dormida","jardín de sacrificio","distancia","sol","aire","viento","sauce viejo","cisne blanco","crisantemo accidental","empañado reservorio","historia oculta","dimensión alada","salada existencia","amanecer ceniza","camino eléctrico","sed","perro vagabundo","día","voz del Padre","ruina de mariposa","monte amarillo","vigilia","trueno","señal de luz","signo","tiempo de silencios","corazón","sueño","péndulo ventarrón","Alcanfor Sonoro","paraíso singular","tierra muerta","calendario desdentado","cajón de laberintos","anhelo mecánico","sanguijuela alada","pájaro ciego","montaña muerta","oso hueco","señora nube nodriza","señor azul marino","árbol ensombrecido","amarillo fractal","zumbido blanco","desidia anacrónica","luz azul","cielo luminoso","sol radiante","cicatriz","sudario","casa callada","mariposa anaranjada","rosal","bosque aromático","maga inexorable","fuente musical","Ilusorio Dios","cancionero","antimateria encendida","hemisferio umbrío","delirio circular","plano astral","gusano","momento uterino","canción atónita","baño azul","invierno","brisa","hueso","sonido espejo","curioso universo","tierra gramática","intimidad de espadas","elegía","diluvio","estado de alerta","grillo","enigma","paraguas","faro sistemático","rey","mañana","puerto","acantilado","metal","laberinto","bicicleta","laurel","procesión","nube","desierto"];
const actions = ["silba","llora","resbala","anuncia el huracán","teje un delirio","se conjura","disimula el deceso","electrifica","se cobriza","da dos respiros","late","rescata sus huesos","ladra","disuelve","se disuelve","amanece","disminuye","refleja un corazón","espera","muerde el freno","se apaga","vuelve a alegrarse","se distrae","se desconcierta","se nutre de atmósfera","retumba","gotea","gobierna la angustia","sostiene la desdicha","cruza a nado","quema los dedos","no cicatriza","baila a oscuras","se disfraza","se anestesia","salta al deseo","avanza hacia el primer llanto","sofoca el aluvión","recuerda luz","acelera el curso","tiembla","llueve","desmiente el engaño","se fulmina","negocia un alto el fuego","viste al verano","ofrece bostezos","comprende el silencio","nunca cierra","confía el amanecer","no se salva","mira hasta crecer","corre los ríos","devuelve todo","irradia sentido","bosteza","germina","se entinta","escupe","huele a flores","huele a muerte","encarna la brisa","empuja el delirio","hace nacer","duerme","se deja ver","se pone en escena","finge ser leído","actúa","produce prodigios","se enterca","olvida","promete","miente","desestima promesas","entristece el camino","avanza","bufa","sublima los abrazos","se oye","ama sin hacer ruido","calla","grita","analiza","se escapa","pregunta","sobrevive","se instala"];
const places = ["en el azul mar de la ofensa","sobre una rama","en días de calor","en el altar","bajo el bajo puente","en el umbral","en el interior de su gusano","en el baño azul","en invierno","dentro de la mirada","en la memoria","en el sótano de la memoria","al sur de la vendimia","en su lavadero","en tu desierto","entre las manos","en su costado encendido","en el acantilado","en el puerto","en la distancia","en el hemisferio umbrío","en el plano astral","en el centro del vacío","en el circuito de luz blanca","en agua","en las praderas congeladas","de día y de noche","en el eterno mar de dudas","en el cielo diurno","en penumbras","sobre el papel madera","en el espejo","en la sombra azul","a oscuras","en el camino","en el jardín","entre dientes","en la noche","bajo el sol sin tapujos","en el territorio antiguo","en casa callada y sola","en el brillo del rosal","en días de ternura","en papel de plata","en el armónico silencio","en largos caminos de pereza","en el amanecer ceniza","entre los ciegos árboles","en el huracán","en el delirio obligatorio","en el fango","en la humareda","en la cárcel de fieras","a través del espejo","junto al faro","en la orilla","en la tormenta","en el diluvio","en los pies","en la lluvia","en el aire","en el monte amarillo","en la vigilia","en la mañana","en el cajón de laberintos","en el calendario","en el laurel","en la procesión","sin otros abrigos","sin olvido","sin otra agonía","sin lengua","con las rodillas atadas","en la herida","al amanecer","entre sombras","en un viejo recuerdo"];
const pick = a => a[Math.floor(Math.random()*a.length)];
const verse = document.getElementById('verse');
document.getElementById('generate').addEventListener('click', () => { const s=pick(subjects), a=pick(actions), p=pick(places); verse.textContent=s.charAt(0).toLocaleUpperCase('es')+s.slice(1)+' '+a+' '+p; });
document.getElementById('copy').addEventListener('click', async () => { const b=document.getElementById('copy'); try { await navigator.clipboard.writeText(verse.textContent); b.textContent='COPIADO'; setTimeout(()=>b.textContent='COPIAR VERSO',1400); } catch { b.textContent='SELECCIONÁ EL VERSO'; } });
</script></body></html>
